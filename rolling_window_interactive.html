<html lang="en">
<head>
<meta charset="UTF-8">

<title>Rolling Window Validation — Tuscany Tourist Flows</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:18px 16px 30px}
h1{font-size:1.05rem;font-weight:600;color:#c9d1d9;margin-bottom:14px;letter-spacing:-0.01em}
.city-row{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.city-btn{padding:5px 14px;border-radius:6px;border:1px solid #30363d;background:#161b22;color:#8b949e;cursor:pointer;font-size:.8rem;transition:all .15s}
.city-btn:hover{border-color:#58a6ff;color:#c9d1d9}
.city-btn.active{background:#1f6feb22;border-color:#58a6ff;color:#58a6ff;font-weight:600}
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card-lbl{font-size:.68rem;color:#8b949e;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
canvas{display:block;width:100%;cursor:crosshair}
#mainCanvas{height:265px}
#fcastCanvas{height:215px}
.ctrl-row{display:flex;align-items:center;gap:9px;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:9px 13px;margin-bottom:10px}
.arr{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
.arr:hover{background:#30363d}.arr:disabled{opacity:.3;cursor:default}
#slider{flex:1;-webkit-appearance:none;height:3px;background:#30363d;border-radius:2px;outline:none;cursor:pointer}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#58a6ff;cursor:pointer}
#slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#58a6ff;border:none;cursor:pointer}
.win-info{font-size:.78rem;color:#8b949e;white-space:nowrap;flex-shrink:0}
.win-num{color:#e6edf3;font-weight:700}
.stats-row{display:flex;align-items:center;gap:10px;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:11px 14px;flex-wrap:wrap}
.stat-badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:4px}
.stat-badge.s{color:#58a6ff;background:#58a6ff14;border:1px solid #58a6ff30}
.stat-badge.l{color:#f0883e;background:#f0883e14;border:1px solid #f0883e30}
.stat-grp{display:flex;gap:13px;align-items:center}
.metric{font-size:.79rem;color:#8b949e}
.metric b{color:#e6edf3;font-weight:600}
.divider{width:1px;height:22px;background:#30363d}
.legend{display:flex;gap:13px;margin-left:auto;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:.7rem;color:#8b949e}
.leg-line{width:18px;height:2px;border-radius:1px}
.leg-dash{width:18px;height:2px;border-radius:1px;background-image:repeating-linear-gradient(to right,currentColor 0,currentColor 4px,transparent 4px,transparent 7px)}
</style>
</head>
<body>
<h1>Walk-Forward Rolling Window Validation &mdash; Tuscany Tourist Flows</h1>

<div class="city-row" id="cityRow"></div>

<div class="card">
  <div class="card-lbl" id="mainLbl">Full Time Series &mdash; Jan 2019 to Jul 2024</div>
  <canvas id="mainCanvas"></canvas>
</div>

<div class="ctrl-row">
  <button class="arr" id="prevBtn">&#9664;</button>
  <input type="range" id="slider" min="1" max="20" value="1">
  <button class="arr" id="nextBtn">&#9654;</button>
  <div class="win-info" id="winInfo">Window <span class="win-num">1</span>&thinsp;/&thinsp;20</div>
</div>

<div class="card">
  <div class="card-lbl" id="fcastLbl">Test Period Detail</div>
  <canvas id="fcastCanvas"></canvas>
</div>

<div class="stats-row" id="statsRow">
  <span class="stat-badge s">SARIMA</span>
  <div class="stat-grp">
    <div class="metric">MAPE <b id="sMAPE">—</b>%</div>
    <div class="metric">MAE <b id="sMAE">—</b></div>
    <div class="metric">RMSE <b id="sRMSE">—</b></div>
  </div>
  <div class="divider"></div>
  <span class="stat-badge l">LSTM</span>
  <div class="stat-grp">
    <div class="metric">MAPE <b id="lMAPE">—</b>%</div>
    <div class="metric">MAE <b id="lMAE">—</b></div>

    <div class="leg"><div class="leg-line" style="background:#f0883e;opacity:.6"></div>LSTM &plusmn;MAE</div>

</div>

const CITIES   = ['Arezzo','Firenze','Lucca','Pisa','Siena'];
const TRAIN_W  = 36;
const TEST_W   = 12;
const N_MONTHS = 67;   // Jan2019–Jul2024

// Colours
const CLR = {
  bg:'#0d1117', panel:'#161b22', grid:'#21262d', border:'#30363d',
  text:'#e6edf3', muted:'#8b949e',
  actual:'#3fb950', sarima:'#58a6ff', lstm:'#f0883e',
  covid:'rgba(248,81,73,.09)',
  train:'rgba(88,166,255,.10)', trainBdr:'rgba(88,166,255,.35)',
  test:'rgba(240,136,62,.16)',  testBdr:'rgba(240,136,62,.5)',
};

// ── State ───────────────────────────────────────────────────
let city    = 'Arezzo';
let winIdx  = 1;       // 1-based integer
let dispW   = 1.0;     // fractional for animation
let rafId   = null;

// ── City buttons ────────────────────────────────────────────
const cityRow = document.getElementById('cityRow');
CITIES.forEach(c => {
  const b = document.createElement('button');
  b.className = 'city-btn' + (c===city?' active':'');
  b.textContent = c;
  b.onclick = () => setCity(c);
  cityRow.appendChild(b);
});

// ── Canvas setup ────────────────────────────────────────────
const mainC   = document.getElementById('mainCanvas');
const fcastC  = document.getElementById('fcastCanvas');
const mCtx    = mainC.getContext('2d');
const fCtx    = fcastC.getContext('2d');

function setupCanvas(cv, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const w   = cv.parentElement.clientWidth - 24;
  cv.style.width  = w + 'px';
  cv.style.height = cssH + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(cssH * dpr);
  return { dpr, cw: cv.width, ch: cv.height, cssW: w, cssH };
}

// Fixed CSS-pixel margins (for hit testing)
const MP = { top:30, right:22, bottom:50, left:68 };

// ── Formatting ──────────────────────────────────────────────
function fmt(v) { return v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v).toString(); }

// ── MAIN CHART ──────────────────────────────────────────────
function drawMain() {
  const {dpr,cw,ch} = setupCanvas(mainC, 265);
  const ctx = mCtx;
  const m = { t:MP.top*dpr, r:MP.right*dpr, b:MP.bottom*dpr, l:MP.left*dpr };
  const pw = cw - m.l - m.r;   // plot width  (canvas px)
  const ph = ch - m.t - m.b;   // plot height (canvas px)

  const data = TS[city];
  const yMax = Math.max(...data.map(p=>p.v)) * 1.12;
  const yMin = 0;

  ctx.clearRect(0, 0, cw, ch);

  // helpers
  const mX  = i => m.l + (i/66)*pw;
  const vY  = v => m.t + (1-(v-yMin)/(yMax-yMin))*ph;

  // ── COVID fill ──────────────────────────────────────────
  const cx1 = mX(14), cx2 = mX(24);
  ctx.fillStyle = CLR.covid;
  ctx.fillRect(cx1, m.t, cx2-cx1, ph);

  // ── Window shading (fractional for smooth animation) ───
  const w0   = dispW - 1;            // 0-based float
  const trX1 = mX(w0);
  const trX2 = mX(w0 + TRAIN_W);
  const teX2 = mX(w0 + TRAIN_W + TEST_W);

  ctx.fillStyle = CLR.train;
  ctx.fillRect(trX1, m.t, trX2-trX1, ph);

  ctx.fillStyle = CLR.test;
  ctx.fillRect(trX2, m.t, teX2-trX2, ph);

  // train border
  ctx.strokeStyle = CLR.trainBdr;
  ctx.lineWidth = dpr;
  ctx.setLineDash([3*dpr,3*dpr]);
  ctx.strokeRect(trX1+.5*dpr, m.t+.5*dpr, trX2-trX1-dpr, ph-dpr);
  ctx.setLineDash([]);

  // test border
  ctx.strokeStyle = CLR.testBdr;
  ctx.lineWidth = dpr;
  ctx.setLineDash([3*dpr,3*dpr]);
  ctx.strokeRect(trX2+.5*dpr, m.t+.5*dpr, teX2-trX2-dpr, ph-dpr);
  ctx.setLineDash([]);

  // train/test split line
  ctx.strokeStyle = 'rgba(240,136,62,.75)';
  ctx.lineWidth = 1.5*dpr;
  ctx.beginPath(); ctx.moveTo(trX2, m.t); ctx.lineTo(trX2, m.t+ph); ctx.stroke();

  // ── Grid ────────────────────────────────────────────────
  const nY = 5;
  ctx.strokeStyle = CLR.grid; ctx.lineWidth = dpr;
  for (let i=1; i<nY; i++) {
    const y = vY(yMin + (yMax-yMin)*i/nY);
    ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(m.l+pw,y); ctx.stroke();
  }

  // ── Actual line ─────────────────────────────────────────
  ctx.strokeStyle = CLR.actual; ctx.lineWidth = 2*dpr; ctx.lineJoin='round';
  ctx.beginPath();
  data.forEach((p,i) => { const x=mX(i), y=vY(p.v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();

  // dots
  data.forEach((p,i) => {
    ctx.fillStyle = CLR.actual;
    ctx.beginPath(); ctx.arc(mX(i), vY(p.v), 2.2*dpr, 0, 2*Math.PI); ctx.fill();
  });

  // ── Axes ────────────────────────────────────────────────
  // Y labels
  ctx.fillStyle = CLR.muted; ctx.textAlign='right';
  ctx.font = `${9.5*dpr}px -apple-system,sans-serif`;
  for (let i=0; i<=nY; i++) {
    const val = yMin + (yMax-yMin)*i/nY;
    const y   = vY(val);
    ctx.fillText(fmt(val), m.l-5*dpr, y+3.5*dpr);
    if (i===0||i===nY) {
      ctx.strokeStyle=CLR.border; ctx.lineWidth=dpr;
      ctx.beginPath(); ctx.moveTo(m.l-3*dpr,y); ctx.lineTo(m.l,y); ctx.stroke();
    }
  }

  // X labels (years)
  ctx.textAlign='center'; ctx.fillStyle=CLR.muted;
  [2019,2020,2021,2022,2023,2024].forEach(yr => {
    const idx = (yr-2019)*12;
    if (idx > 66) return;
    const x = mX(idx);
    ctx.strokeStyle=CLR.border; ctx.lineWidth=dpr;
    ctx.beginPath(); ctx.moveTo(x, m.t+ph); ctx.lineTo(x, m.t+ph+5*dpr); ctx.stroke();
    ctx.fillStyle=CLR.muted;
    ctx.fillText(yr, x, m.t+ph+15*dpr);
  });

  // Axis lines
  ctx.strokeStyle=CLR.border; ctx.lineWidth=dpr;
  ctx.beginPath();
  ctx.moveTo(m.l, m.t); ctx.lineTo(m.l, m.t+ph);
  ctx.moveTo(m.l, m.t+ph); ctx.lineTo(m.l+pw, m.t+ph);
  ctx.stroke();

  // ── Window & COVID labels ───────────────────────────────
  const wi = Math.round(dispW);
  const wd = WINS[city][wi-1];
  ctx.font = `${8.5*dpr}px -apple-system,sans-serif`;
  ctx.textAlign='center';

  if (trX2-trX1 > 55*dpr) {
    ctx.fillStyle='rgba(88,166,255,.75)';
    ctx.fillText('TRAIN', (trX1+trX2)/2, m.t+13*dpr);
    ctx.font=`${7.5*dpr}px -apple-system,sans-serif`;
    ctx.fillText(wd.ts+'–'+wd.te, (trX1+trX2)/2, m.t+23*dpr);
    ctx.font=`${8.5*dpr}px -apple-system,sans-serif`;
  }
  if (teX2-trX2 > 35*dpr) {
    ctx.fillStyle='rgba(240,136,62,.9)';
    ctx.fillText('TEST', (trX2+teX2)/2, m.t+13*dpr);
    ctx.font=`${7.5*dpr}px -apple-system,sans-serif`;
    ctx.fillText(wd.ws+'–'+wd.we, (trX2+teX2)/2, m.t+23*dpr);
    ctx.font=`${8.5*dpr}px -apple-system,sans-serif`;
  }

  ctx.fillStyle='rgba(248,81,73,.45)';
  ctx.fillText('COVID', (cx1+cx2)/2, m.t+13*dpr);
}

// ── FORECAST PANEL ──────────────────────────────────────────
function drawFcast() {
  const {dpr,cw,ch} = setupCanvas(fcastC, 215);
  const ctx = fCtx;
  const m   = { t:MP.top*dpr, r:MP.right*dpr, b:MP.bottom*dpr, l:MP.left*dpr };
  const pw  = cw-m.l-m.r;
  const ph  = ch-m.t-m.b;

  ctx.clearRect(0,0,cw,ch);

  const wi   = Math.round(dispW);
  const wd   = WINS[city][wi-1];
  const data = TS[city];

  // slice: 6 context months + 12 test months = 18 total
  const CTX_N    = 6;
  const tsi      = wi-1+TRAIN_W;              // test start index in TS
  const sliceS   = tsi - CTX_N;
  const sliceE   = tsi + TEST_W;              // exclusive
  const slice    = data.slice(sliceS, sliceE);// length 18
  const N        = slice.length;              // 18
  const nSteps   = N - 1;                    // 17

  // Y range: accommodate error bands
  const bandMax  = Math.max(wd.sm, wd.lm);
  const rawVals  = slice.map(p=>p.v);
  const yMax     = Math.max(...rawVals) + bandMax * 1.15;
  const yMin     = Math.max(0, Math.min(...rawVals) - bandMax * 0.4);

  const xOf  = i  => m.l + (i/nSteps)*pw;
  const yOf  = v  => m.t + (1-(v-yMin)/(yMax-yMin))*ph;

  const splitI = CTX_N;  // index where test starts (inclusive)
  const splitX = xOf(splitI);

  // Zone fills
  ctx.fillStyle='rgba(88,166,255,.05)';
  ctx.fillRect(m.l, m.t, splitX-m.l, ph);
  ctx.fillStyle='rgba(240,136,62,.05)';
  ctx.fillRect(splitX, m.t, m.l+pw-splitX, ph);

  // Split line
  ctx.strokeStyle='rgba(240,136,62,.55)';
  ctx.lineWidth=1.5*dpr; ctx.setLineDash([4*dpr,3*dpr]);
  ctx.beginPath(); ctx.moveTo(splitX,m.t); ctx.lineTo(splitX,m.t+ph); ctx.stroke();
  ctx.setLineDash([]);

  // Grid
  ctx.strokeStyle=CLR.grid; ctx.lineWidth=dpr;
  for (let i=1; i<5; i++) {
    const y = yOf(yMin+(yMax-yMin)*i/5);
    ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(m.l+pw,y); ctx.stroke();
  }

  // ── SARIMA ±MAE band (test zone only) ──────────────────
  function band(mae, fillClr, lineClr) {
    // fill
    ctx.fillStyle = fillClr;
    ctx.beginPath();
    for (let i=splitI; i<N; i++) { const x=xOf(i),y=yOf(slice[i].v+mae); i===splitI?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    for (let i=N-1; i>=splitI; i--) { const x=xOf(i),y=yOf(Math.max(yMin,slice[i].v-mae)); ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fill();
    // boundary dashes
    ctx.strokeStyle=lineClr; ctx.lineWidth=dpr; ctx.setLineDash([3*dpr,2*dpr]);
    [[+1],[- 1]].forEach(([sign]) => {
      ctx.beginPath();
      for (let i=splitI; i<N; i++) {
        const x=xOf(i), y=yOf(Math.max(yMin, slice[i].v + sign*mae));
        i===splitI?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }
  band(wd.sm, 'rgba(88,166,255,.13)',  'rgba(88,166,255,.5)');
  band(wd.lm, 'rgba(240,136,62,.10)', 'rgba(240,136,62,.45)');

  // ── Actual line ─────────────────────────────────────────
  ctx.strokeStyle=CLR.actual; ctx.lineWidth=2*dpr; ctx.lineJoin='round';
  ctx.beginPath();
  slice.forEach((p,i)=>{ const x=xOf(i),y=yOf(p.v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();

  // Dots
  slice.forEach((p,i) => {
    ctx.fillStyle = i>=splitI ? CLR.actual : 'rgba(63,185,80,.38)';
    ctx.beginPath();
    ctx.arc(xOf(i), yOf(p.v), (i>=splitI?3.2:2.2)*dpr, 0, 2*Math.PI);
    ctx.fill();
  });

  // ── Axes ────────────────────────────────────────────────
  // Y labels
  ctx.fillStyle=CLR.muted; ctx.textAlign='right';
  ctx.font=`${9*dpr}px -apple-system,sans-serif`;
  for (let i=0; i<=4; i++) {
    const val = yMin+(yMax-yMin)*i/4;
    ctx.fillText(fmt(val), m.l-5*dpr, yOf(val)+3.5*dpr);
  }

  // X labels — month+year for test months (every 2nd)
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  ctx.textAlign='center'; ctx.font=`${8.5*dpr}px -apple-system,sans-serif`;
  slice.forEach((p,i) => {
    if (i < splitI && i !== 0 && i !== 3) return; // show only first and mid of context
    if (i >= splitI && (i-splitI)%2 !== 0) return; // every 2nd test month
    const [yr, mo] = p.d.split('-');
    const lbl = MO[parseInt(mo)-1]+'’'+yr.slice(2);
    const x   = xOf(i);
    ctx.fillStyle = i>=splitI ? CLR.muted : 'rgba(139,148,158,.45)';
    ctx.fillText(lbl, x, m.t+ph+14*dpr);
    ctx.strokeStyle = i>=splitI ? CLR.border : 'rgba(48,54,61,.5)';
    ctx.lineWidth=dpr;
    ctx.beginPath(); ctx.moveTo(x,m.t+ph); ctx.lineTo(x,m.t+ph+5*dpr); ctx.stroke();
  });

  // Axis lines
  ctx.strokeStyle=CLR.border; ctx.lineWidth=dpr;
  ctx.beginPath();
  ctx.moveTo(m.l,m.t); ctx.lineTo(m.l,m.t+ph);
  ctx.moveTo(m.l,m.t+ph); ctx.lineTo(m.l+pw,m.t+ph);
  ctx.stroke();

  // Zone labels
  ctx.font=`${8*dpr}px -apple-system,sans-serif`; ctx.textAlign='center';
  ctx.fillStyle='rgba(88,166,255,.5)';
  ctx.fillText('← Train context', (m.l+splitX)/2, m.t+13*dpr);
  ctx.fillStyle='rgba(240,136,62,.75)';
  ctx.fillText('Test period →', (splitX+m.l+pw)/2, m.t+13*dpr);
}

// ── Update stats bar ────────────────────────────────────────
function updateStats() {
  const wi = Math.round(dispW);
  const wd = WINS[city][wi-1];
  document.getElementById('sMAPE').textContent = wd.sp.toFixed(1);
  document.getElementById('sMAE').textContent  = wd.sm.toFixed(1);
  document.getElementById('sRMSE').textContent = wd.sr.toFixed(1);
  document.getElementById('lMAPE').textContent = wd.lp.toFixed(1);
  document.getElementById('lMAE').textContent  = wd.lm.toFixed(1);
  document.getElementById('lRMSE').textContent = wd.lr.toFixed(1);
  document.getElementById('winInfo').innerHTML =
    `Window <span class="win-num">${wi}</span>&thinsp;/&thinsp;20&ensp;<span style="color:#8b949e;font-size:.72rem">${wd.ts} – ${wd.te} | test ${wd.ws} – ${wd.we}</span>`;
  document.getElementById('fcastLbl').textContent = `Test Period Detail — ${wd.ws} to ${wd.we} (Window ${wi}/20)`;
  document.getElementById('prevBtn').disabled = wi <= 1;
  document.getElementById('nextBtn').disabled = wi >= 20;
  document.getElementById('slider').value = wi;
}

function renderAll() { drawMain(); drawFcast(); updateStats(); }

// ── Animation ───────────────────────────────────────────────
function easeOut3(t) { return 1-Math.pow(1-t,3); }

function animTo(target) {
  if (rafId) cancelAnimationFrame(rafId);
  const from = dispW, start = performance.now(), dur = 280;
  (function step(now) {
    const t = Math.min((now-start)/dur, 1);
    dispW = from + (target-from)*easeOut3(t);
    renderAll();
    if (t < 1) rafId = requestAnimationFrame(step);
    else dispW = target;
  })(start);
}

function setWin(w, animate=true) {
  w = Math.max(1, Math.min(20, Math.round(w)));
  if (w === winIdx && Math.abs(dispW-w)<0.01) return;
  winIdx = w;
  animate ? animTo(w) : (dispW=w, renderAll());
}

function setCity(c) {
  city = c;
  document.querySelectorAll('.city-btn').forEach(b => b.classList.toggle('active', b.textContent===c));
  renderAll();
}

// ── Drag interaction on main chart ──────────────────────────
let drag = { active:false, startX:0, startWin:1 };

function xToWin(cssX) {
  const rect = mainC.getBoundingClientRect();
  const chartW = rect.width - MP.left - MP.right;
  const monthFrac = (cssX - rect.left - MP.left) / chartW * 66;
  // snap so train/test midpoint is near cursor
  return Math.round(monthFrac - (TRAIN_W + TEST_W)/2) + 1;
}

mainC.addEventListener('mousemove', e => {
  if (drag.active) {
    const rect = mainC.getBoundingClientRect();
    const chartW = rect.width - MP.left - MP.right;
    const delta = (e.clientX - drag.startX) / (chartW/66);
    const newW  = Math.max(1, Math.min(20, Math.round(drag.startWin + delta)));
    if (newW !== winIdx) { winIdx=newW; dispW=newW; renderAll(); }
    mainC.style.cursor = 'grabbing';
  } else {
    // show grab cursor when hovering over highlighted region
    const rect = mainC.getBoundingClientRect();
    const chartW = rect.width - MP.left - MP.right;
    const monthFrac = (e.clientX - rect.left - MP.left) / chartW * 66;
    const w0 = dispW - 1;
    mainC.style.cursor = (monthFrac >= w0 && monthFrac <= w0+TRAIN_W+TEST_W) ? 'grab' : 'crosshair';
  }
});

mainC.addEventListener('mousedown', e => {
  drag.active  = true;
  drag.startX  = e.clientX;
  drag.startWin = winIdx;
  mainC.style.cursor = 'grabbing';
});

window.addEventListener('mouseup', () => {
  if (drag.active) { drag.active=false; mainC.style.cursor='grab'; }
});

mainC.addEventListener('click', e => {
  if (Math.abs(e.clientX - (drag.startX||e.clientX)) < 3) {
    setWin(xToWin(e.clientX));
  }
});

// ── Controls ────────────────────────────────────────────────
const slider = document.getElementById('slider');
slider.addEventListener('input', () => { winIdx=+slider.value; dispW=winIdx; renderAll(); });
document.getElementById('prevBtn').onclick = () => setWin(winIdx-1);
document.getElementById('nextBtn').onclick = () => setWin(winIdx+1);

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft'||e.key==='ArrowDown')  { e.preventDefault(); setWin(winIdx-1); }
  if (e.key==='ArrowRight'||e.key==='ArrowUp')   { e.preventDefault(); setWin(winIdx+1); }
});

// Resize
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT=setTimeout(renderAll,60); });

// ── Boot ────────────────────────────────────────────────────
renderAll();
</script>
